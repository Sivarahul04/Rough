<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Crumb - Home Bakery</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff8f0; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Mock Database / Backend Simulation ---
        const DB_KEYS = {
            USERS: 'bakery_users',
            PRODUCTS: 'bakery_products',
            ORDERS: 'bakery_orders',
            MESSAGES: 'bakery_messages',
            CURRENT_USER: 'bakery_current_user'
        };

        const INITIAL_DATA = {
            users: [
                { id: 1, username: 'owner', password: '123', role: 'OWNER', name: 'Sarah Baker' },
                { id: 2, username: 'user', password: '123', role: 'USER', name: 'John Doe' }
            ],
            products: [
                { id: 1, name: 'Artisan Sourdough', price: 8.50, description: 'Freshly baked wild yeast sourdough bread.', image: 'https://images.unsplash.com/photo-1585478564773-e992af294d56?auto=format&fit=crop&q=80&w=400' },
                { id: 2, name: 'Chocolate Fudge Cake', price: 25.00, description: 'Rich chocolate layers with ganache frosting.', image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&q=80&w=400' },
                { id: 3, name: 'Blueberry Muffins (Pack of 4)', price: 12.00, description: 'Bursting with fresh blueberries and crumble top.', image: 'https://images.unsplash.com/photo-1558401391-7899b4bd5bbf?auto=format&fit=crop&q=80&w=400' },
                { id: 4, name: 'Classic Croissant', price: 3.50, description: 'Buttery, flaky, and authentic French recipe.', image: 'https://images.unsplash.com/photo-1555507036-ab1f40388085?auto=format&fit=crop&q=80&w=400' }
            ],
            orders: [],
            messages: [] // { id, fromId, toId, text, timestamp }
        };

        // Initialize LocalStorage if empty
        const initDB = () => {
            if (!localStorage.getItem(DB_KEYS.USERS)) localStorage.setItem(DB_KEYS.USERS, JSON.stringify(INITIAL_DATA.users));
            if (!localStorage.getItem(DB_KEYS.PRODUCTS)) localStorage.setItem(DB_KEYS.PRODUCTS, JSON.stringify(INITIAL_DATA.products));
            if (!localStorage.getItem(DB_KEYS.ORDERS)) localStorage.setItem(DB_KEYS.ORDERS, JSON.stringify(INITIAL_DATA.orders));
            if (!localStorage.getItem(DB_KEYS.MESSAGES)) localStorage.setItem(DB_KEYS.MESSAGES, JSON.stringify(INITIAL_DATA.messages));
        };
        initDB();

        // Helper to access/update DB
        const db = {
            get: (key) => JSON.parse(localStorage.getItem(key) || '[]'),
            set: (key, data) => localStorage.setItem(key, JSON.stringify(data)),
            getCurrentUser: () => JSON.parse(localStorage.getItem(DB_KEYS.CURRENT_USER)),
            setCurrentUser: (user) => localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify(user)),
            logout: () => localStorage.removeItem(DB_KEYS.CURRENT_USER)
        };

        // --- Components ---

        // 1. Navigation Bar
        const Navbar = ({ user, setView, cartCount, onLogout }) => {
            return (
                <nav className="bg-amber-800 text-white p-4 shadow-md sticky top-0 z-50">
                    <div className="container mx-auto flex justify-between items-center">
                        <div className="flex items-center cursor-pointer" onClick={() => setView('home')}>
                            <i className="fas fa-bread-slice text-2xl mr-2"></i>
                            <h1 className="text-xl font-bold tracking-wide">Sweet Crumb</h1>
                        </div>
                        <div className="flex items-center gap-4">
                            {user ? (
                                <>
                                    <span className="hidden md:inline text-amber-200 text-sm">Welcome, {user.name} ({user.role})</span>
                                    
                                    {user.role === 'OWNER' && (
                                        <>
                                            <button onClick={() => setView('admin-orders')} className="hover:text-amber-200 transition">Orders</button>
                                            <button onClick={() => setView('admin-products')} className="hover:text-amber-200 transition">Products</button>
                                            <button onClick={() => setView('chat')} className="hover:text-amber-200 transition">
                                                <i className="fas fa-envelope"></i>
                                            </button>
                                        </>
                                    )}

                                    {user.role === 'USER' && (
                                        <>
                                            <button onClick={() => setView('home')} className="hover:text-amber-200 transition">Shop</button>
                                            <button onClick={() => setView('chat')} className="hover:text-amber-200 transition">
                                                <i className="fas fa-comment-dots mr-1"></i> Chat
                                            </button>
                                            <button onClick={() => setView('cart')} className="relative hover:text-amber-200 transition">
                                                <i className="fas fa-shopping-cart text-lg"></i>
                                                {cartCount > 0 && (
                                                    <span className="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">
                                                        {cartCount}
                                                    </span>
                                                )}
                                            </button>
                                            <button onClick={() => setView('orders')} className="hover:text-amber-200 transition">My Orders</button>
                                        </>
                                    )}

                                    <button onClick={onLogout} className="bg-amber-900 hover:bg-amber-700 px-3 py-1 rounded text-sm transition">
                                        Logout
                                    </button>
                                </>
                            ) : (
                                <>
                                    <button onClick={() => setView('login')} className="hover:text-amber-200 transition">Login</button>
                                    <button onClick={() => setView('register')} className="bg-white text-amber-800 px-4 py-1 rounded font-semibold hover:bg-amber-100 transition">Register</button>
                                </>
                            )}
                        </div>
                    </div>
                </nav>
            );
        };

        // 2. Login / Register
        const Auth = ({ type, onAuthSuccess, setView }) => {
            const [formData, setFormData] = useState({ username: '', password: '', name: '', role: 'USER' });
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const users = db.get(DB_KEYS.USERS);

                if (type === 'login') {
                    const user = users.find(u => u.username === formData.username && u.password === formData.password);
                    if (user) {
                        db.setCurrentUser(user);
                        onAuthSuccess(user);
                    } else {
                        setError('Invalid credentials');
                    }
                } else {
                    if (users.find(u => u.username === formData.username)) {
                        setError('Username already exists');
                        return;
                    }
                    const newUser = { ...formData, id: Date.now() };
                    db.set(DB_KEYS.USERS, [...users, newUser]);
                    db.setCurrentUser(newUser);
                    onAuthSuccess(newUser);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-amber-50">
                    <div className="bg-white p-8 rounded-lg shadow-lg w-full max-w-md border border-amber-100">
                        <h2 className="text-2xl font-bold text-amber-800 mb-6 text-center">{type === 'login' ? 'Welcome Back' : 'Create Account'}</h2>
                        
                        {type === 'login' && (
                            <div className="flex gap-3 mb-6">
                                <button type="button" onClick={() => setFormData({...formData, username: 'owner', password: '123'})} className="flex-1 bg-amber-100 text-amber-900 text-xs py-2 rounded hover:bg-amber-200 border border-amber-200 transition">
                                    Fill Owner
                                </button>
                                <button type="button" onClick={() => setFormData({...formData, username: 'user', password: '123'})} className="flex-1 bg-blue-50 text-blue-900 text-xs py-2 rounded hover:bg-blue-100 border border-blue-200 transition">
                                    Fill Customer
                                </button>
                            </div>
                        )}

                        {error && <div className="bg-red-100 text-red-600 p-2 rounded mb-4 text-sm text-center">{error}</div>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {type === 'register' && (
                                <>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Full Name</label>
                                        <input required type="text" className="mt-1 w-full p-2 border rounded focus:ring-2 focus:ring-amber-500 outline-none" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Account Type</label>
                                        <select className="mt-1 w-full p-2 border rounded focus:ring-2 focus:ring-amber-500 outline-none" value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})}>
                                            <option value="USER">Customer</option>
                                            <option value="OWNER">Bakery Owner</option>
                                        </select>
                                    </div>
                                </>
                            )}
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Username</label>
                                <input required type="text" className="mt-1 w-full p-2 border rounded focus:ring-2 focus:ring-amber-500 outline-none" value={formData.username} onChange={e => setFormData({...formData, username: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Password</label>
                                <input required type="password" className="mt-1 w-full p-2 border rounded focus:ring-2 focus:ring-amber-500 outline-none" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} />
                            </div>
                            <button type="submit" className="w-full bg-amber-600 text-white py-2 rounded hover:bg-amber-700 transition font-medium">
                                {type === 'login' ? 'Login' : 'Sign Up'}
                            </button>
                        </form>
                        <p className="mt-4 text-center text-sm text-gray-600">
                            {type === 'login' ? "Don't have an account? " : "Already have an account? "}
                            <span onClick={() => setView(type === 'login' ? 'register' : 'login')} className="text-amber-700 cursor-pointer hover:underline">
                                {type === 'login' ? 'Sign up' : 'Login'}
                            </span>
                        </p>
                        {type === 'login' && (
                             <div className="mt-4 pt-4 border-t border-gray-100 text-xs text-gray-400 text-center">
                                <p>Demo: owner/123 or user/123</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 3. Product List (User View)
        const ProductList = ({ addToCart }) => {
            const [products, setProducts] = useState([]);
            
            useEffect(() => {
                setProducts(db.get(DB_KEYS.PRODUCTS));
            }, []);

            return (
                <div className="container mx-auto p-6 animate-fade-in">
                    <div className="text-center mb-10">
                        <h2 className="text-3xl font-bold text-amber-900">Fresh From The Oven</h2>
                        <p className="text-amber-700 mt-2">Handcrafted with love and the finest ingredients</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {products.map(product => (
                            <div key={product.id} className="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition duration-300 transform hover:-translate-y-1 border border-amber-50">
                                <div className="h-48 overflow-hidden relative group">
                                    <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-110 transition duration-500" />
                                    <button onClick={() => addToCart(product)} className="absolute bottom-3 right-3 bg-white text-amber-600 w-10 h-10 rounded-full shadow-lg flex items-center justify-center hover:bg-amber-600 hover:text-white transition">
                                        <i className="fas fa-plus"></i>
                                    </button>
                                </div>
                                <div className="p-5">
                                    <div className="flex justify-between items-start mb-2">
                                        <h3 className="text-lg font-bold text-gray-800 leading-tight">{product.name}</h3>
                                        <span className="text-amber-600 font-bold">Rs {product.price.toFixed(2)}</span>
                                    </div>
                                    <p className="text-gray-600 text-sm line-clamp-2">{product.description}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // 4. Cart & Checkout
        const Cart = ({ cart, setCart, setView }) => {
            const [isPaying, setIsPaying] = useState(false);
            const [paymentStep, setPaymentStep] = useState('cart'); // cart, payment, success

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const updateQuantity = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        return { ...item, quantity: Math.max(0, item.quantity + delta) };
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const handlePayment = (e) => {
                e.preventDefault();
                setIsPaying(true);
                
                // Simulate API call
                setTimeout(() => {
                    const newOrder = {
                        id: Date.now(),
                        userId: db.getCurrentUser().id,
                        userName: db.getCurrentUser().name,
                        items: cart,
                        total: total,
                        date: new Date().toISOString(),
                        status: 'Pending'
                    };
                    
                    const orders = db.get(DB_KEYS.ORDERS);
                    db.set(DB_KEYS.ORDERS, [newOrder, ...orders]);
                    
                    setCart([]);
                    setIsPaying(false);
                    setPaymentStep('success');
                }, 2000);
            };

            if (paymentStep === 'success') {
                return (
                    <div className="container mx-auto p-6 flex flex-col items-center justify-center h-[60vh] animate-fade-in">
                        <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-4">
                            <i className="fas fa-check text-4xl text-green-500"></i>
                        </div>
                        <h2 className="text-2xl font-bold text-gray-800 mb-2">Order Placed Successfully!</h2>
                        <p className="text-gray-600 mb-6">Thank you for your purchase. Your treats are on the way.</p>
                        <button onClick={() => setView('home')} className="bg-amber-600 text-white px-6 py-2 rounded hover:bg-amber-700 transition">
                            Continue Shopping
                        </button>
                    </div>
                );
            }

            if (paymentStep === 'payment') {
                return (
                    <div className="container mx-auto p-6 max-w-md animate-fade-in">
                        <div className="bg-white p-6 rounded-lg shadow-lg">
                            <div className="flex items-center mb-6 cursor-pointer" onClick={() => setPaymentStep('cart')}>
                                <i className="fas fa-arrow-left text-gray-400 mr-2"></i>
                                <h2 className="text-xl font-bold">Payment Details</h2>
                            </div>
                            <div className="mb-6 p-4 bg-amber-50 rounded border border-amber-100 flex justify-between items-center">
                                <span className="font-semibold text-amber-900">Total Amount</span>
                                <span className="text-xl font-bold text-amber-900">${total.toFixed(2)}</span>
                            </div>
                            <form onSubmit={handlePayment} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Card Number</label>
                                    <div className="relative">
                                        <input required type="text" maxLength="19" placeholder="0000 0000 0000 0000" className="w-full p-3 border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-amber-500 outline-none pl-10" />
                                        <i className="fas fa-credit-card absolute left-3 top-3.5 text-gray-400"></i>
                                    </div>
                                </div>
                                <div className="flex gap-4">
                                    <div className="w-1/2">
                                        <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Expiry</label>
                                        <input required type="text" placeholder="MM/YY" className="w-full p-3 border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-amber-500 outline-none" />
                                    </div>
                                    <div className="w-1/2">
                                        <label className="block text-xs font-bold text-gray-500 uppercase mb-1">CVC</label>
                                        <input required type="text" maxLength="3" placeholder="123" className="w-full p-3 border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-amber-500 outline-none" />
                                    </div>
                                </div>
                                <button disabled={isPaying} type="submit" className="w-full bg-amber-600 text-white py-3 rounded font-bold hover:bg-amber-700 transition mt-4 flex items-center justify-center">
                                    {isPaying ? <i className="fas fa-spinner fa-spin"></i> : `Pay $${total.toFixed(2)}`}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container mx-auto p-6 max-w-4xl animate-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800 mb-6">Your Shopping Cart</h2>
                    {cart.length === 0 ? (
                        <div className="text-center py-12 bg-white rounded-lg shadow-sm">
                            <i className="fas fa-shopping-basket text-6xl text-gray-200 mb-4"></i>
                            <p className="text-gray-500 text-lg">Your cart is empty</p>
                            <button onClick={() => setView('home')} className="mt-4 text-amber-600 font-semibold hover:underline">Start Shopping</button>
                        </div>
                    ) : (
                        <div className="flex flex-col md:flex-row gap-8">
                            <div className="flex-1 bg-white rounded-lg shadow-sm p-6">
                                {cart.map(item => (
                                    <div key={item.id} className="flex items-center justify-between py-4 border-b last:border-0">
                                        <div className="flex items-center">
                                            <img src={item.image} className="w-16 h-16 object-cover rounded-md mr-4 bg-gray-100" />
                                            <div>
                                                <h3 className="font-bold text-gray-800">{item.name}</h3>
                                                <p className="text-sm text-gray-500">${item.price.toFixed(2)}</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center bg-gray-100 rounded-lg">
                                            <button onClick={() => updateQuantity(item.id, -1)} className="px-3 py-1 hover:text-red-500 transition">-</button>
                                            <span className="px-2 text-sm font-medium">{item.quantity}</span>
                                            <button onClick={() => updateQuantity(item.id, 1)} className="px-3 py-1 hover:text-green-500 transition">+</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="w-full md:w-80 bg-white rounded-lg shadow-sm p-6 h-fit">
                                <h3 className="text-lg font-bold mb-4">Order Summary</h3>
                                <div className="flex justify-between mb-2 text-gray-600">
                                    <span>Subtotal</span>
                                    <span>Rs {total.toFixed(2)}</span>
                                </div>
                                <div className="flex justify-between mb-4 text-gray-600">
                                    <span>Taxes</span>
                                    <span>Rs 0.00</span>
                                </div>
                                <div className="border-t pt-4 flex justify-between font-bold text-xl text-gray-800 mb-6">
                                    <span>Total</span>
                                    <span>${total.toFixed(2)}</span>
                                </div>
                                <button onClick={() => setPaymentStep('payment')} className="w-full bg-amber-600 text-white py-3 rounded font-bold hover:bg-amber-700 transition shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                                    Proceed to Checkout
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 5. Admin Dashboard (Products & Orders)
        const AdminDashboard = ({ view }) => {
            const [products, setProducts] = useState([]);
            const [orders, setOrders] = useState([]);
            const [editingProduct, setEditingProduct] = useState(null); // null = creating

            useEffect(() => {
                setProducts(db.get(DB_KEYS.PRODUCTS));
                setOrders(db.get(DB_KEYS.ORDERS));
            }, [view]);

            const handleSaveProduct = (e) => {
                e.preventDefault();
                const name = e.target.name.value;
                const price = parseFloat(e.target.price.value);
                const desc = e.target.description.value;
                const image = e.target.image.value || 'https://via.placeholder.com/400';

                let newProducts;
                if (editingProduct && editingProduct.id) {
                    newProducts = products.map(p => p.id === editingProduct.id ? { ...p, name, price, description: desc, image } : p);
                } else {
                    const newProd = { id: Date.now(), name, price, description: desc, image };
                    newProducts = [...products, newProd];
                }
                
                db.set(DB_KEYS.PRODUCTS, newProducts);
                setProducts(newProducts);
                setEditingProduct(null);
            };

            const handleDeleteProduct = (id) => {
                if (!confirm('Are you sure?')) return;
                const newProducts = products.filter(p => p.id !== id);
                db.set(DB_KEYS.PRODUCTS, newProducts);
                setProducts(newProducts);
            };

            if (view === 'admin-orders') {
                return (
                    <div className="container mx-auto p-6 animate-fade-in">
                        <h2 className="text-2xl font-bold text-amber-900 mb-6">Incoming Orders</h2>
                        <div className="space-y-4">
                            {orders.length === 0 && <p className="text-gray-500 italic">No orders yet.</p>}
                            {orders.map(order => (
                                <div key={order.id} className="bg-white p-6 rounded-lg shadow border-l-4 border-amber-500">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h3 className="font-bold text-lg">Order #{order.id.toString().slice(-6)}</h3>
                                            <p className="text-sm text-gray-500">Customer: {order.userName} | {new Date(order.date).toLocaleString()}</p>
                                        </div>
                                        <span className="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full text-xs font-bold">{order.status}</span>
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded mb-4">
                                        {order.items.map((item, idx) => (
                                            <div key={idx} className="flex justify-between text-sm mb-1 last:mb-0">
                                                <span>{item.quantity}x {item.name}</span>
                                                <span>${(item.price * item.quantity).toFixed(2)}</span>
                                            </div>
                                        ))}
                                        <div className="border-t border-gray-200 mt-2 pt-2 flex justify-between font-bold">
                                            <span>Total</span>
                                            <span>${order.total.toFixed(2)}</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="container mx-auto p-6 animate-fade-in">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-amber-900">Product Management</h2>
                        <button onClick={() => setEditingProduct({})} className="bg-amber-600 text-white px-4 py-2 rounded hover:bg-amber-700">
                            <i className="fas fa-plus mr-2"></i> Add Product
                        </button>
                    </div>

                    {editingProduct && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-lg w-full max-w-md">
                                <h3 className="text-xl font-bold mb-4">{editingProduct.id ? 'Edit' : 'Add'} Product</h3>
                                <form onSubmit={handleSaveProduct} className="space-y-3">
                                    <input name="name" defaultValue={editingProduct.name} placeholder="Product Name" required className="w-full p-2 border rounded" />
                                    <input name="price" type="number" step="0.01" defaultValue={editingProduct.price} placeholder="Price" required className="w-full p-2 border rounded" />
                                    <textarea name="description" defaultValue={editingProduct.description} placeholder="Description" required className="w-full p-2 border rounded"></textarea>
                                    <input name="image" defaultValue={editingProduct.image} placeholder="Image URL" className="w-full p-2 border rounded" />
                                    <div className="flex justify-end gap-2 mt-4">
                                        <button type="button" onClick={() => setEditingProduct(null)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancel</button>
                                        <button type="submit" className="px-4 py-2 bg-amber-600 text-white rounded hover:bg-amber-700">Save</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <div className="bg-white rounded-lg shadow overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-amber-50 border-b">
                                <tr>
                                    <th className="p-4 text-sm font-bold text-gray-600">Product</th>
                                    <th className="p-4 text-sm font-bold text-gray-600">Price</th>
                                    <th className="p-4 text-sm font-bold text-gray-600 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {products.map(p => (
                                    <tr key={p.id} className="hover:bg-gray-50">
                                        <td className="p-4">
                                            <div className="font-medium">{p.name}</div>
                                            <div className="text-xs text-gray-500 truncate max-w-xs">{p.description}</div>
                                        </td>
                                        <td className="p-4">${p.price.toFixed(2)}</td>
                                        <td className="p-4 text-right space-x-2">
                                            <button onClick={() => setEditingProduct(p)} className="text-blue-600 hover:text-blue-800"><i className="fas fa-edit"></i></button>
                                            <button onClick={() => handleDeleteProduct(p.id)} className="text-red-600 hover:text-red-800"><i className="fas fa-trash"></i></button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // 6. Chat System
        const Chat = () => {
            const currentUser = db.getCurrentUser();
            const [users, setUsers] = useState([]);
            const [activeChatUser, setActiveChatUser] = useState(null);
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');

            useEffect(() => {
                const allUsers = db.get(DB_KEYS.USERS);
                // If owner, show all users. If user, show owner only (or simulate 'admin' contact)
                if (currentUser.role === 'OWNER') {
                    setUsers(allUsers.filter(u => u.role === 'USER'));
                } else {
                    const owners = allUsers.filter(u => u.role === 'OWNER');
                    if (owners.length > 0) setActiveChatUser(owners[0]); // Auto select owner for user
                }
                
                // Load messages interval
                const interval = setInterval(() => {
                    setMessages(db.get(DB_KEYS.MESSAGES));
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            const sendMessage = (e) => {
                e.preventDefault();
                if (!newMessage.trim() || !activeChatUser) return;

                const msg = {
                    id: Date.now(),
                    fromId: currentUser.id,
                    toId: activeChatUser.id,
                    text: newMessage,
                    timestamp: new Date().toISOString()
                };

                const existingMsgs = db.get(DB_KEYS.MESSAGES);
                db.set(DB_KEYS.MESSAGES, [...existingMsgs, msg]);
                setMessages([...existingMsgs, msg]);
                setNewMessage('');
            };

            // Filter messages for the current conversation
            const conversation = messages.filter(m => 
                (m.fromId === currentUser.id && m.toId === activeChatUser?.id) ||
                (m.fromId === activeChatUser?.id && m.toId === currentUser.id)
            );

            return (
                <div className="container mx-auto p-6 h-[calc(100vh-80px)] flex gap-6 animate-fade-in">
                    {currentUser.role === 'OWNER' && (
                        <div className="w-1/3 bg-white rounded-lg shadow overflow-hidden flex flex-col">
                            <div className="p-4 bg-amber-50 border-b border-amber-100 font-bold text-amber-900">Customers</div>
                            <div className="overflow-y-auto flex-1">
                                {users.length === 0 && <div className="p-4 text-gray-400 text-sm">No customers yet.</div>}
                                {users.map(u => (
                                    <div 
                                        key={u.id} 
                                        onClick={() => setActiveChatUser(u)}
                                        className={`p-4 border-b cursor-pointer hover:bg-gray-50 transition ${activeChatUser?.id === u.id ? 'bg-amber-50 border-l-4 border-amber-500' : ''}`}
                                    >
                                        <div className="font-bold text-gray-800">{u.name}</div>
                                        <div className="text-xs text-gray-500">@{u.username}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className={`flex-1 bg-white rounded-lg shadow flex flex-col ${currentUser.role === 'USER' ? 'w-full' : ''}`}>
                        {activeChatUser ? (
                            <>
                                <div className="p-4 border-b flex items-center bg-gray-50 rounded-t-lg">
                                    <div className="w-10 h-10 bg-amber-200 rounded-full flex items-center justify-center text-amber-800 font-bold mr-3">
                                        {activeChatUser.name[0]}
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-gray-800">{activeChatUser.name}</h3>
                                        <p className="text-xs text-green-600 flex items-center"><span className="w-2 h-2 bg-green-500 rounded-full mr-1"></span> Online</p>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50" id="chat-box">
                                    {conversation.length === 0 && (
                                        <div className="text-center text-gray-400 mt-10">
                                            <p>Start a conversation with {activeChatUser.name}</p>
                                        </div>
                                    )}
                                    {conversation.map(msg => {
                                        const isMe = msg.fromId === currentUser.id;
                                        return (
                                            <div key={msg.id} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[70%] px-4 py-2 rounded-2xl shadow-sm ${isMe ? 'bg-amber-600 text-white rounded-tr-none' : 'bg-white text-gray-800 rounded-tl-none'}`}>
                                                    <p>{msg.text}</p>
                                                    <p className={`text-[10px] mt-1 ${isMe ? 'text-amber-200' : 'text-gray-400'}`}>
                                                        {new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                                    </p>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="p-4 border-t bg-white rounded-b-lg">
                                    <form onSubmit={sendMessage} className="flex gap-2">
                                        <input 
                                            type="text" 
                                            value={newMessage}
                                            onChange={e => setNewMessage(e.target.value)}
                                            placeholder="Type your message..." 
                                            className="flex-1 p-3 border rounded-full focus:ring-2 focus:ring-amber-500 outline-none bg-gray-50"
                                        />
                                        <button type="submit" className="bg-amber-600 text-white w-12 h-12 rounded-full hover:bg-amber-700 shadow-lg transition flex items-center justify-center">
                                            <i className="fas fa-paper-plane"></i>
                                        </button>
                                    </form>
                                </div>
                            </>
                        ) : (
                            <div className="flex-1 flex items-center justify-center text-gray-400 flex-col">
                                <i className="fas fa-comments text-6xl mb-4 text-gray-200"></i>
                                <p>Select a conversation to start chatting</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 7. User Orders
        const UserOrders = () => {
            const currentUser = db.getCurrentUser();
            const [orders, setOrders] = useState([]);

            useEffect(() => {
                const allOrders = db.get(DB_KEYS.ORDERS);
                setOrders(allOrders.filter(o => o.userId === currentUser.id).sort((a, b) => b.id - a.id));
            }, []);

            return (
                <div className="container mx-auto p-6 animate-fade-in">
                    <h2 className="text-2xl font-bold text-amber-900 mb-6">My Order History</h2>
                    <div className="space-y-4">
                        {orders.length === 0 ? (
                            <p className="text-gray-500">No orders yet. Time to treat yourself!</p>
                        ) : (
                            orders.map(order => (
                                <div key={order.id} className="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
                                    <div className="flex justify-between items-start mb-2">
                                        <span className="font-bold text-gray-700">Order #{order.id.toString().slice(-6)}</span>
                                        <span className="text-sm text-gray-500">{new Date(order.date).toLocaleDateString()}</span>
                                    </div>
                                    <div className="mb-2">
                                        {order.items.map(i => (
                                            <span key={i.id} className="inline-block bg-gray-100 rounded px-2 py-1 text-xs mr-2 mb-1">
                                                {i.quantity}x {i.name}
                                            </span>
                                        ))}
                                    </div>
                                    <div className="flex justify-between items-center mt-4 pt-4 border-t">
                                        <span className="font-bold text-lg">${order.total.toFixed(2)}</span>
                                        <span className="px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs font-bold">
                                            {order.status}
                                        </span>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }


        // --- Main App Component ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login'); // login, register, home, cart, admin-products, admin-orders, chat, orders
            const [cart, setCart] = useState([]);

            useEffect(() => {
                const loggedInUser = db.getCurrentUser();
                if (loggedInUser) {
                    setUser(loggedInUser);
                    setView(loggedInUser.role === 'OWNER' ? 'admin-orders' : 'home');
                }
            }, []);

            const handleAuthSuccess = (user) => {
                setUser(user);
                setView(user.role === 'OWNER' ? 'admin-orders' : 'home');
            };

            const handleLogout = () => {
                db.logout();
                setUser(null);
                setCart([]);
                setView('login');
            };

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { ...product, quantity: 1 }];
                });
                
                // Show toast notification simulation
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-4 right-4 bg-green-600 text-white px-6 py-3 rounded shadow-lg z-50 animate-fade-in';
                toast.innerText = 'Added to cart!';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            };

            const renderContent = () => {
                if (!user) {
                    if (view === 'register') return <Auth type="register" onAuthSuccess={handleAuthSuccess} setView={setView} />;
                    return <Auth type="login" onAuthSuccess={handleAuthSuccess} setView={setView} />;
                }

                switch (view) {
                    case 'home': return <ProductList addToCart={addToCart} />;
                    case 'cart': return <Cart cart={cart} setCart={setCart} setView={setView} />;
                    case 'admin-products': return <AdminDashboard view="admin-products" />;
                    case 'admin-orders': return <AdminDashboard view="admin-orders" />;
                    case 'chat': return <Chat />;
                    case 'orders': return <UserOrders />;
                    default: return <ProductList addToCart={addToCart} />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col bg-orange-50/30">
                    <Navbar 
                        user={user} 
                        setView={setView} 
                        cartCount={cart.reduce((a, b) => a + b.quantity, 0)} 
                        onLogout={handleLogout} 
                    />
                    <main className="flex-1">
                        {renderContent()}
                    </main>
                    <footer className="bg-amber-900 text-amber-200 py-6 text-center text-sm mt-auto">
                        <p>&copy; 2023 Sweet Crumb Bakery. All rights reserved.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
